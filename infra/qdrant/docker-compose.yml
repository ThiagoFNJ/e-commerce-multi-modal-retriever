# Retriever vector store — reproducibility contract:
#   * image pinned by DIGEST (tag v1.15.1 is informational; the digest is authoritative)
#   * server config versioned in-repo, mounted read-only
#   * storage in a named volume; snapshots bind-mounted for archival to GCS
# CLIs must refuse to run if the server's reported version != 1.15.1 (see retriever_ctl.py).
services:
  qdrant:
    image: qdrant/qdrant:v1.15.1@sha256:d122138f76868edba68d36cb0833139c1d1761f00f09e48e61f8314196e6a4c6
    container_name: emmr-qdrant
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
      - ./snapshots:/qdrant/snapshots
      - ./config.yaml:/qdrant/config/production.yaml:ro
    healthcheck:
      # the image ships no curl/wget; bash /dev/tcp is the portable probe
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

volumes:
  qdrant_storage:
